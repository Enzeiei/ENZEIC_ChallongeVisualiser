<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Bracket — Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=M+PLUS+U:wght@100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --panel: #12161d;
    --panel-border: #232a35;
    --amber: #ffb000;
    --amber-dim: #7a5600;
    --text: #e9edf3;
    --text-dim: #7c8798;
    --live-green: #35d488;
    --danger: #ff5d5d;
  }
  /* #TODO: Transferring this godforsaken thing to an actual file*/
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'M PLUS U', sans-serif;
    overflow-x: hidden;
  }

  body {
    background-image:
      radial-gradient(circle at 10% 0%, rgba(255,176,0,0.06), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(53,212,136,0.05), transparent 45%);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 20px 32px;
    border-bottom: 1px solid var(--panel-border);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--live-green);
    box-shadow: 0 0 10px var(--live-green);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .brand .dot.offline { background: var(--text-dim); box-shadow: none; animation: none; }
  .brand .dot.error { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }

  .brand h1 {
    font-size: 20px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
    font-weight: 700;
  }

  .brand .status-text {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .control-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  /* Toggle switch */
  .switch {
    position: relative;
    width: 46px;
    height: 24px;
    background: #262c37;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid var(--panel-border);
    transition: background 0.2s ease;
    flex-shrink: 0;
  }
  .switch.on { background: var(--amber-dim); }
  .switch .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch.on .knob {
    transform: translateX(22px);
    background: var(--amber);
    box-shadow: 0 0 8px rgba(255,176,0,0.7);
  }

  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 13px;
  }

  button.poll-now {
    background: transparent;
    border: 1px solid var(--amber);
    color: var(--amber);
    padding: 8px 16px;
    border-radius: 6px;
    font-family: 'M PLUS U', sans-serif;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button.poll-now:hover:not(:disabled) { background: var(--amber); color: #14100a; }
  button.poll-now:disabled { opacity: 0.4; cursor: default; }
  button.poll-now.spinning { animation: spin-border 0.9s linear infinite; }
  @keyframes spin-border { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

  .filter-group { gap: 8px; }
  .check-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .check-pill .check-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3a4250;
    flex-shrink: 0;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .check-pill.on { color: var(--text); border-color: var(--amber-dim); }
  .check-pill.on .check-dot {
    background: var(--amber);
    box-shadow: 0 0 6px rgba(255,176,0,0.7);
  }

  main {
    padding: 28px 32px 60px;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .meta-row .count {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .error-banner {
    display: none;
    background: rgba(255,93,93,0.1);
    border: 1px solid var(--danger);
    color: #ffb3b3;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .error-banner.show { display: block; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }

  .match-card {
    background: linear-gradient(180deg, var(--panel), #0d1015);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }

  .match-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--live-green), transparent);
  }

  .match-card .row-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--live-green);
    font-weight: 700;
  }
  .live-badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--live-green);
    box-shadow: 0 0 6px var(--live-green);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .live-badge.upcoming { color: var(--text-dim); }
  .live-badge.upcoming .dot {
    background: var(--text-dim);
    box-shadow: none;
    animation: none;
  }
  .match-card.upcoming::before { background: linear-gradient(90deg, var(--text-dim), transparent); }

  .players {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .player {
    flex: 1;
    min-width: 0;
  }
  .player .name {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .vs {
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 4px;
  }

  .score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 30px;
    font-weight: 700;
    color: var(--amber);
    text-shadow: 0 0 12px rgba(255,176,0,0.35);
    letter-spacing: 0.05em;
    text-align: center;
    margin: 14px 0 6px;
  }

  .row-bottom {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    margin-top: 10px;
    border-top: 1px solid var(--panel-border);
    padding-top: 10px;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }
  .empty-state .big {
    font-size: 15px;
    color: var(--text);
    margin-bottom: 6px;
  }

  @media (max-width: 640px) {
    .topbar { padding: 16px 18px; }
    main { padding: 20px 18px 40px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <span class="dot" id="statusDot"></span>
      <h1>ENZEIC Live Bracket</h1>
      <span class="status-text" id="statusText">connecting…</span>
    </div>

    <div class="controls">
      <div class="control-group">
        <span class="control-label">Auto-refresh</span>
        <div class="switch" id="autoToggle" role="switch" aria-checked="true" tabindex="0">
          <div class="knob"></div>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">Every</span>
        <select id="intervalSelect">
          <option value="10000">10s</option>
          <option value="20000" selected>20s</option>
          <option value="30000">30s</option>
          <option value="60000">60s</option>
        </select>
      </div>
      <button class="poll-now" id="pollNowBtn">Poll now</button>
      
      <div class="control-group filter-group">
        <span class="control-label">Show</span>
        <div class="check-pill on" id="filterpending" role="button" tabindex="0">
          <span class="check-dot"></span><span>Live</span>
        </div>
        <div class="check-pill on" id="filterOpen" role="button" tabindex="0">
          <span class="check-dot"></span><span>Upcoming</span>
        </div>
      </div>
    </div>
  </div>

  <main>
    <div class="error-banner" id="errorBanner"></div>

    <div class="meta-row">
      <span class="count" id="matchCount">— matches pending</span>
      <span class="count" id="lastPolled">last polled —</span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="big">No matches currently pending</div>
      <div>They'll appear here as soon as they go live.</div>
    </div>
  </main>

<script>
  const autoToggle = document.getElementById('autoToggle');
  const intervalSelect = document.getElementById('intervalSelect');
  const pollNowBtn = document.getElementById('pollNowBtn');
  const filterpending = document.getElementById('filterpending');
  const filterOpen = document.getElementById('filterOpen');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const errorBanner = document.getElementById('errorBanner');
  const matchCount = document.getElementById('matchCount');
  const lastPolled = document.getElementById('lastPolled');
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');

  let displayTimer = null;

  let latestData = { matches: [] }; // server payload, refiltered client-side on checkbox changes

  const DISPLAY_REFRESH_MS = 3000; // how often the page re-reads our own cache (cheap, local only)

  function fmtTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function getFilteredMatches() {
    const showpending = filterpending.classList.contains('on');
    const showOpen = filterOpen.classList.contains('on');
    return (latestData.matches || []).filter(m => {
      if (m.state === 'pending') return showpending;
      if (m.state === 'open') return showOpen;
      return true; // don't hide anything we don't recognize
    });
  }

  function render(data) {
    latestData = data;
    const allMatches = data.matches || [];
    const matches = getFilteredMatches();
 
    const liveCount = allMatches.filter(m => m.state === 'pending').length;
    const upcomingCount = allMatches.filter(m => m.state === 'open').length;
    matchCount.textContent = `${liveCount} live · ${upcomingCount} upcoming (showing ${matches.length})`;
    lastPolled.textContent = `last polled ${fmtTime(data.lastPolledAt)}`;
 
    if (data.lastError) {
      errorBanner.textContent = `Last poll failed: ${data.lastError}`;
      errorBanner.classList.add('show');
      statusDot.className = 'dot error';
      statusText.textContent = 'error — see banner';
    } else {
      errorBanner.classList.remove('show');
      statusDot.className = data.autoPollEnabled ? 'dot' : 'dot offline';
      statusText.textContent = data.autoPollEnabled
        ? `auto-refreshing every ${Math.round(data.intervalMs / 1000)}s`
        : 'auto-refresh off — poll manually';
    }
 
    autoToggle.classList.toggle('on', !!data.autoPollEnabled);
    autoToggle.setAttribute('aria-checked', String(!!data.autoPollEnabled));
    if (String(data.intervalMs) && intervalSelect.value !== String(data.intervalMs)) {
      // only sync if it matches one of our options, otherwise leave user's selection alone
      const match = [...intervalSelect.options].some(o => o.value === String(data.intervalMs));
      if (match) intervalSelect.value = String(data.intervalMs);
    }
 
    grid.innerHTML = '';
    emptyState.style.display = matches.length ? 'none' : 'block';
 
    for (const m of matches) {
      const isLive = m.state === 'pending';
      const card = document.createElement('div');
      card.className = 'match-card' + (isLive ? '' : ' upcoming');
      card.innerHTML = `
        <div class="row-top">
          <span class="eyebrow">Round ${m.round ?? '—'}${m.identifier ? ' · ' + m.identifier : ''}</span>
          <span class="live-badge${isLive ? '' : ' upcoming'}"><span class="dot"></span>${isLive ? 'Live' : 'Upcoming'}</span>
        </div>
        <div class="players">
          <div class="player"><div class="name">${escapeHtml(m.player1.name)}</div></div>
          <div class="vs">vs</div>
          <div class="player" style="text-align:right;"><div class="name">${escapeHtml(m.player2.name)}</div></div>
        </div>
        <div class="score">${m.scores ? escapeHtml(m.scores) : '—'}</div>
        <div class="row-bottom">
          <span>${m.station ? 'Station ' + escapeHtml(m.station) : ''}</span>
          <span>match #${escapeHtml(m.id)}</span>
        </div>
        ${isLive ? '' : `<button class="start-match" data-match-id="${m.id}">Start match</button>`}
      `;
      if (!isLive) {
        const btn = card.querySelector('.start-match');
        btn.addEventListener('click', () => startMatch(m.id, btn));
      }
      else {
        const btn = card.querySelector('.start-match');
        btn.addEventListener('click', () => startMatch(m.id, btn));
      }
      grid.appendChild(card);
    }
  }

  async function startMatch(matchId, btn) {
    btn.disabled = true;
    btn.textContent = 'Starting…';
    try {
      const res = await fetch(`/api/matches/${matchId}/mark-pending`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || `Request failed (${res.status})`);
      }
      render(data); // server already re-polled — reflects the new state immediately
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Start match';
      errorBanner.textContent = `Couldn't start match ${matchId}: ${err.message}`;
      errorBanner.classList.add('show');
    }
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Reads our own server's cache — cheap, does not call Challonge directly.
  async function refreshDisplay() {
    try {
      const res = await fetch('/api/matches');
      const data = await res.json();
      render(data);
    } catch (err) {
      statusText.textContent = 'lost connection to server';
      statusDot.className = 'dot error';
    }
  }

  function startDisplayLoop() {
    stopDisplayLoop();
    displayTimer = setInterval(refreshDisplay, DISPLAY_REFRESH_MS);
  }
  function stopDisplayLoop() {
    if (displayTimer) clearInterval(displayTimer);
    displayTimer = null;
  }

  // --- Controls ---

  async function setAutoPoll(enabled) {
    await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ autoPollEnabled: enabled }),
    });
    refreshDisplay();
  }

  autoToggle.addEventListener('click', () => {
    setAutoPoll(!autoToggle.classList.contains('on'));
  });
  autoToggle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      setAutoPoll(!autoToggle.classList.contains('on'));
    }
  });

  intervalSelect.addEventListener('change', async () => {
    await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ intervalMs: Number(intervalSelect.value) }),
    });
    refreshDisplay();
  });

  function toggleFilter(el) {
    el.classList.toggle('on');
    render(latestData);
  }

  filterpending.addEventListener('click', () => toggleFilter(filterpending));
  filterOpen.addEventListener('click', () => toggleFilter(filterOpen));
  [filterpending, filterOpen].forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleFilter(el);
      }
    });
  });

  pollNowBtn.addEventListener('click', async () => {
    pollNowBtn.disabled = true;
    pollNowBtn.classList.add('spinning');
    pollNowBtn.textContent = 'Polling…';
    try {
      const res = await fetch('/api/poll', { method: 'POST' });
      const data = await res.json();
      render(data);
    } finally {
      pollNowBtn.disabled = false;
      pollNowBtn.classList.remove('spinning');
      pollNowBtn.textContent = 'Poll now';
    }
  });

  // Boot
  refreshDisplay();
  startDisplayLoop();
</script>
</body>
</html>
